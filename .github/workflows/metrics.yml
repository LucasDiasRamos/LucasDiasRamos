name: Visual GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: write

concurrency:
  group: visual-github-metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Render public language breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasDiasRamos
          filename: assets/metrics-languages.svg
          base: ""
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          config_timezone: America/Campo_Grande
          committer_message: "chore: refresh language metrics [skip ci]"

      - name: Render isometric contributions calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasDiasRamos
          filename: assets/metrics-isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Campo_Grande
          committer_message: "chore: refresh contribution calendar [skip ci]"

      - name: Render recent public activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasDiasRamos
          filename: assets/metrics-activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_visibility: public
          plugin_activity_limit: 5
          config_timezone: America/Campo_Grande
          committer_message: "chore: refresh public activity [skip ci]"
